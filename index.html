<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Detector</title>
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>AI Content Detector</h1>
    
    <div class="input-group">
        <label for="textToAnalyze">Paste text to analyze:</label>
        <textarea id="textToAnalyze" placeholder="Paste your text here to check if it was generated by AI..."></textarea>
    </div>

    <button id="analyzeBtn">Analyze Text</button>
    <div id="loader" class="loader">Analyzing writing patterns... Please wait.</div>

    <div id="result-box">
        <div class="result-header">Analysis Results:</div>
        <div id="analysisResult" class="analysis-text"></div>
    </div>
</div>

<!-- Custom JS -->
<script src="script.js"></script>
</body>
</html>
