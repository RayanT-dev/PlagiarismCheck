<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détecteur de Texte AI (Groq)</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        #result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .result-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: #60a5fa;
        }

        .analysis-text {
            line-height: 1.6;
            color: #e2e8f0;
        }

        /* Styles pour que le rendu Markdown soit propre */
        .analysis-text h2, .analysis-text h3 {
            color: #93c5fd;
            margin-top: 15px;
        }

        .analysis-text table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
        }

        .analysis-text th, .analysis-text td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        .analysis-text th {
            background-color: #1e293b;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-style: italic;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Détecteur de Contenu AI</h1>
    
    <div class="input-group">
        <label for="textToAnalyze">Collez le texte à analyser :</label>
        <textarea id="textToAnalyze" placeholder="Insérez votre texte ici..."></textarea>
    </div>

    <button id="analyzeBtn" onclick="analyzeText()">Analyser le texte</button>
    <div id="loader" class="loader">Analyse en cours... Veuillez patienter.</div>

    <div id="result-box">
        <div class="result-header">Résultat de l'analyse :</div>
        <div id="analysisResult" class="analysis-text"></div>
    </div>
</div>

<script>
    const GROQ_API_KEY = "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";
    const MODEL_NAME = "openai/gpt-oss-120b";

    async function analyzeText() {
        const textToAnalyze = document.getElementById("textToAnalyze").value.trim();
        const analyzeBtn = document.getElementById("analyzeBtn");
        const loader = document.getElementById("loader");
        const resultBox = document.getElementById("result-box");
        const analysisResult = document.getElementById("analysisResult");

        if (!textToAnalyze) {
            alert("Veuillez coller un texte à analyser.");
            return;
        }

        analyzeBtn.disabled = true;
        loader.style.display = "block";
        resultBox.style.display = "none";
        analysisResult.innerHTML = "";

        const prompt = `
Tu es un outil d'analyse de texte. Réponds de façon directe, claire et naturelle, sans ton scolaire ou robotique.
Analyse ce texte :

"${textToAnalyze}"

Fournis ton retour ainsi :
1. Score estimé : Donne un pourcentage de chance que ce soit écrit par une IA.
2. Points clés : Explique rapidement (style, vocabulaire, répétitions ou anecdotes) pourquoi tu donnes ce score.
3. Verdict : Une phrase simple et tranchée (Ex: "Texte 100% humain", "Clairement généré par IA", etc.).
        `;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [
                        {
                            role: "user",
                            content: prompt
                        }
                    ],
                    temperature: 0.3
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || "Erreur lors de la requête.");
            }

            const data = await response.json();
            const reply = data.choices[0].message.content;

            analysisResult.innerHTML = marked.parse(reply);
            resultBox.style.display = "block";

        } catch (error) {
            alert("Erreur : " + error.message);
        } finally {
            analyzeBtn.disabled = false;
            loader.style.display = "none";
        }
    }
</script>

</body>
</html>
