<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Détecteur de Plagiat AI</title>

<style>

body{
font-family:Arial;
background:#f5f7fb;
padding:40px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 10px 30px #ddd;
}

textarea{
width:100%;
height:220px;
padding:15px;
font-size:16px;
border-radius:10px;
border:1px solid #ccc;
}

button{
margin-top:15px;
padding:12px 25px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.result{
margin-top:25px;
background:#f8fafc;
padding:20px;
border-radius:10px;
}

.red{
background:#fee2e2;
color:#dc2626;
padding:3px;
}

.yellow{
background:#fef3c7;
color:#d97706;
padding:3px;
}

</style>

</head>


<body>


<div class="container">

<h1>🔍 Détecteur de Plagiat AI</h1>

<p>
Analyse ton texte pour détecter des signes de copie ou de génération automatique.
</p>


<textarea id="text" placeholder="Colle ton texte ici..."></textarea>


<button onclick="analyse()">
Analyser
</button>


<div class="result" id="result">
Résultat ici...
</div>


</div>



<script>


function analyse(){


let text=document.getElementById("text").value;


if(text.length<30){
alert("Texte trop court");
return;
}


let words=text.toLowerCase()
.replace(/[.,!?]/g,"")
.split(/\s+/);



let total=words.length;



// mots répétés

let frequency={};


words.forEach(w=>{
frequency[w]=(frequency[w]||0)+1;
});


let repeated=[];


for(let w in frequency){

if(frequency[w]>5 && w.length>4){
repeated.push(w);
}

}




// phrases trop génériques

let aiPatterns=[

"il est important de",
"dans le monde actuel",
"joue un rôle essentiel",
"de plus",
"en conclusion",
"il convient de noter",
"permet de mieux comprendre",
"grâce à cette"

];


let aiScore=0;


aiPatterns.forEach(p=>{

if(text.toLowerCase().includes(p)){
aiScore+=10;
}

});



aiScore=Math.min(aiScore,90);



// répétition

let repeatScore=Math.min(
repeated.length*5,
30
);



// score final

let plagiarism=Math.min(
aiScore+repeatScore,
95
);


let originality=100-plagiarism;



let highlighted=text;


repeated.forEach(word=>{

let regex=new RegExp(word,"gi");

highlighted=
highlighted.replace(
regex,
`<span class="red">${word}</span>`
);

});



document.getElementById("result").innerHTML=`

<h2>Résultat</h2>

<p>🟢 Originalité :
<b>${originality}%</b>
</p>


<p>🔴 Risque de plagiat :
<b>${plagiarism}%</b>
</p>


<p>🤖 Style IA possible :
<b>${aiScore}%</b>
</p>


<hr>


<h3>Passages suspects :</h3>

<p>${highlighted}</p>


<h3>Mots trop répétés :</h3>

<p>
${repeated.length ?
repeated.join(", ")
:
"Aucun"}
</p>

`;

}


</script>


</body>
</html>
