<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détecteur de Plagiat AI (Groq)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .grid-inputs {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        textarea {
            width: 100%;
            height: 250px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #2563eb;
        }

        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }

        #result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: none;
        }

        .result-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .analysis-text {
            white-space: pre-wrap;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-style: italic;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Analyseur de Plagiat AI</h1>
    
    <div class="grid-inputs">
        <div class="input-group">
            <label for="originalText">Texte de Référence (Original) :</label>
            <textarea id="originalText" placeholder="Collez le texte source ou original ici..."></textarea>
        </div>
        <div class="input-group">
            <label for="suspectText">Texte à Analyser (Suspect) :</label>
            <textarea id="suspectText" placeholder="Collez le texte à vérifier ici..."></textarea>
        </div>
    </div>

    <button id="analyzeBtn" onclick="analyzePlagiarism()">Lancer l'Analyse</button>
    <div id="loader" class="loader">Analyse en cours par le modèle Groq... Veuillez patienter.</div>

    <div id="result-box">
        <div class="result-header">Rapport d'Analyse :</div>
        <div id="analysisResult" class="analysis-text"></div>
    </div>
</div>

<script>
    const GROQ_API_KEY = "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";
    const MODEL_NAME = "openai/gpt-oss-120b";

    async function analyzePlagiarism() {
        const originalText = document.getElementById("originalText").value.trim();
        const suspectText = document.getElementById("suspectText").value.trim();
        const analyzeBtn = document.getElementById("analyzeBtn");
        const loader = document.getElementById("loader");
        const resultBox = document.getElementById("result-box");
        const analysisResult = document.getElementById("analysisResult");

        if (!originalText || !suspectText) {
            alert("Veuillez remplir les deux champs de texte avant de lancer l'analyse.");
            return;
        }

        // Interface state: loading
        analyzeBtn.disabled = true;
        loader.style.display = "block";
        resultBox.style.display = "none";
        analysisResult.innerText = "";

        const prompt = `
Tu es un expert en détection de plagiat et d'analyse linguistique.
Compare les deux textes suivants :

[TEXTE DE RÉFÉRENCE / ORIGINAL] :
${originalText}

[TEXTE À ANALYSER / SUSPECT] :
${suspectText}

Fournis une analyse détaillée en français structurée de la manière suivante :
1. **Taux de similarité estimé** : Donner un pourcentage global (ex: 0-100%).
2. **Type de plagiat identifié** : Indiquer s'il s'agit de copier-coller direct, de reformulation/paraphrase proche, ou si les textes sont indépendants.
3. **Passages similaires / Identiques** : Citer les phrases ou extraits suspects.
4. **Conclusion et Recommandations** : Un bref résumé de l'évaluation.
        `;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${GROQ_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: MODEL_NAME,
                    messages: [
                        {
                            role: "user",
                            content: prompt
                        }
                    ],
                    temperature: 0.2
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || "Erreur de communication avec l'API Groq.");
            }

            const data = await response.json();
            const reply = data.choices[0].message.content;

            analysisResult.innerText = reply;
            resultBox.style.display = "block";

        } catch (error) {
            alert("Une erreur s'est produite : " + error.message);
        } finally {
            analyzeBtn.disabled = false;
            loader.style.display = "none";
        }
    }
</script>

</body>
</html>
